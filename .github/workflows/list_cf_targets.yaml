name: List CF targets

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List non-secret wrangler fields
        env:
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          text = os.environ.get("WRANGLER_TOML_CONTENT", "")
          keys = (
              "name =", "main =", "compatibility_date", "compatibility_flags",
              "keep_vars", "[[d1_databases]]", "[assets]", "binding =",
              "directory =", "run_worker_first", "database_name", "database_id",
              "[[routes]]", "pattern =", "custom_domain", "[triggers]", "crons =",
          )
          print("lines", len(text.splitlines()))
          for line in text.splitlines():
              stripped = line.strip()
              upper = stripped.upper()
              if any(word in upper for word in ("PASSWORD", "JWT", "SECRET", "DOMAINS")):
                  continue
              if any(stripped.startswith(key) or stripped == key for key in keys):
                  print(stripped)
          print("has_anonymous", "DISABLE_ANONYMOUS_USER_CREATE_EMAIL" in text)
          PY
