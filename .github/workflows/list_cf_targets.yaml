name: List CF targets

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List non-secret wrangler fields
        env:
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          text = os.environ.get("WRANGLER_TOML_CONTENT", "")
          allow = re.compile(
              r'^(name|main|compatibility_date|compatibility_flags|keep_vars|'
              r'database_name|database_id|binding|directory|run_worker_first|'
              r'pattern|custom_domain|crons)\b|^\s*\[\[|^\[assets\]|^\[vars\]|^\[triggers\]'
          )
          print("lines", len(text.splitlines()))
          for line in text.splitlines():
              stripped = line.strip()
              if not allow.search(stripped):
                  continue
              if re.search(r'PASSWORD|JWT|SECRET|DOMAINS', stripped, re.I):
                  print(stripped.split("=", 1)[0].strip(), "= <redacted>")
                  continue
              print(stripped)
          print("has_anonymous", "DISABLE_ANONYMOUS_USER_CREATE_EMAIL" in text)
          PY
