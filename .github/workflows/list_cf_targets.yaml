name: List CF targets

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List non-secret wrangler fields
        env:
          WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          text = os.environ.get("WRANGLER_TOML_CONTENT", "")
          safe_full = {
              "name", "main", "compatibility_date", "keep_vars",
              "database_name", "database_id", "binding", "directory",
              "run_worker_first", "pattern", "custom_domain",
          }
          print("lines", len(text.splitlines()))
          for i, line in enumerate(text.splitlines(), 1):
              key = line.split("=", 1)[0].strip()
              if key in safe_full or key.startswith("[") or key.startswith("compatibility_flags"):
                  print(line.rstrip())
              else:
                  print(f"{i}|{key[:80]}")
          PY
